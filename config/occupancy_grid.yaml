point_cloud_topic: "/pointlio/cloud_registered"
odom_topic: "/pointlio/odom"
map_frame: "camera_init"
resolution: 0.2
width: 600
height: 600
origin_x: -60.0
origin_y: -60.0
min_height: -1.0
max_height: 2.0
max_range: 80.0
hit_probability: 0.7
miss_probability: 0.4
occupied_threshold: 0.65
free_threshold: 0.35
min_probability: 0.12
max_probability: 0.97
publish_frequency: 5.0
use_keyframe: false
keyframe_translation: 0.5
keyframe_rotation: 0.35
publish_on_update: false
continuous_publish: false
